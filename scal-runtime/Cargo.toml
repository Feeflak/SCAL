[package]
name = "scal-runtime"
version = "0.1.0"
edition = "2024"

[features]
default = ["x11", "wayland"]
wayland = []
x11 = []

[dependencies]
scal-core = { path = "../scal-core" }
scal = { path = ".." }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
log = "0.4"
colog = "1"
tokio = { version = "1.52.3", features = ["full"] }
glam = { version = "0.33.2", features = ["bytemuck"] }
bincode = "1.3"
winit = "0.30"
wgpu = "29.0.3"
notify = "7.0"
pollster = "0.4"
uuid = { version = "1.23.4", features = ["v4"] }
