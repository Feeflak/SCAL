[package]
name = "scal-runtime"
version = "0.1.0"
edition = "2024"

[features]
default = ["x11", "wayland"]
wayland = []
x11 = []

[dependencies]
scal-core = { path = "../scal-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
log = "0.4"
colog = "1"
tokio = { version = "1.52.3", features = ["full"] }
glam = { version = "0.33.2", features = ["bytemuck"] }
bincode = "1.3"
winit = "0.30"
wgpu = "29.0.3"
notify = "7.0"
pollster = "0.4"
uuid = { version = "1.23.4", features = ["v4"] }
bytemuck = "1.25.1"
tree-sitter-highlight = "0.26.10"
tree-sitter = "0.26.10"
tree-sitter-nix = "0.3.0"
tree-sitter-rust = "0.24.2"
tree-sitter-zig = "1.1.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
cosmic-text = "0.19.0"
swash = "0.2.9"
ffmpeg-next = "8.1.0"
image = "0.25.10"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
regex = "1"
rand = "0.8"
cpal = "0.15"
