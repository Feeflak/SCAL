[package]
name = "scal-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
scal-core = { path = "../scal-core" }
scal = { path = ".." }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
log = "0.4"
colog = "1"
tokio = { version = "1.52.3", features = ["full"] }
glam = { version = "0.33.2", features = ["bytemuck"] }
bincode = "1.3"
